<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Debt / EBITDA dashboard</title>
<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#14212e;--mute:#5d6b7a;--line:#d5dde5;--accent:#0b6e8a;--grid:#e3e9ef}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--panel:#16212b;--ink:#e6edf3;--mute:#93a2b1;--line:#2b3a47;--accent:#4cc3e3;--grid:#223039}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.tickers{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.tickers label,.opts label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:14px}
.legend span{display:flex;align-items:center;gap:6px}
.chartwrap{overflow-x:auto}
svg{width:100%;height:auto;display:block;min-width:420px}
.note{color:var(--mute);font-size:13px;margin-top:8px}
.msg{padding:40px 8px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Net Debt / EBITDA dashboard</h1>
  <div class="panel">
    <div class="controls">
      <div><label for="title">Chart title</label><input id="title" type="text" value="Net Debt / EBITDA comparison"></div>
      <div><label for="xl">X-axis attribute</label><input id="xl" type="text" value="Fiscal year (ending March)"></div>
      <div><label for="yl">Y-axis attribute</label><input id="yl" type="text" value="Net Debt / EBITDA (x)"></div>
    </div>
    <label style="margin-top:12px">Companies (tick one or more)</label>
    <div class="tickers" id="tickers"></div>
    <div class="opts">
      <label><input type="checkbox" id="zero" checked> Start Y-axis at zero</label>
      <label><input type="checkbox" id="vals"> Show value labels</label>
    </div>
  </div>
  <div class="panel">
    <div class="legend" id="legend"></div>
    <div class="chartwrap" id="chart"></div>
    <div class="note" id="note"></div>
  </div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var COLORS=["#0b6e8a","#d95f02","#7570b3","#1b9e77","#e7298a","#a6761d","#666666","#e6ab02"];
  var cache={}, tickers=[], colorOf={};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function nice(r,n){var raw=r/n,m=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/m;return(f<=1?1:f<=2?2:f<=5?5:10)*m}
  function xorder(a,b){var da=Date.parse("1 "+a),db=Date.parse("1 "+b);return (isNaN(da)||isNaN(db))?0:da-db}

  function selected(){
    return Array.prototype.slice.call(document.querySelectorAll("#tickers input:checked")).map(function(i){return i.value});
  }

  function draw(){
    var sel=selected().filter(function(t){return cache[t]&&cache[t].series&&cache[t].series.length});
    var host=$("chart");
    $("legend").innerHTML=sel.map(function(t){return'<span><i class="sw" style="background:'+colorOf[t]+'"></i>'+esc(t)+'</span>'}).join("");
    if(!sel.length){host.innerHTML='<div class="msg">Tick at least one company to plot.</div>';$("note").textContent="";return}

    var xs=[];
    sel.forEach(function(t){cache[t].series.forEach(function(p){if(xs.indexOf(p.x)<0)xs.push(p.x)})});
    xs.sort(xorder);
    var all=[];
    sel.forEach(function(t){cache[t].series.forEach(function(p){all.push(p.y)})});
    var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
    if($("zero").checked){lo=Math.min(lo,0);hi=Math.max(hi,0)}
    if(lo===hi)hi=lo+1;
    var W=720,H=400,m={l:64,r:24,t:56,b:70},iw=W-m.l-m.r,ih=H-m.t-m.b;
    var st=nice(hi-lo,5),min=Math.floor(lo/st)*st,max=Math.ceil(hi/st)*st;
    var sx=function(i){return xs.length===1?m.l+iw/2:m.l+i*iw/(xs.length-1)};
    var sy=function(v){return m.t+ih-(v-min)/(max-min)*ih};
    var ink=css("--ink"),mute=css("--mute"),grid=css("--grid"),panel=css("--panel");

    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc($("title").value)+'" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">';
    s+='<text x="'+m.l+'" y="30" font-size="17" font-weight="600" fill="'+ink+'">'+esc($("title").value)+'</text>';
    for(var v=min;v<=max+st/1e6;v+=st){var y=sy(v);
      s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+grid+'"/><text x="'+(m.l-8)+'" y="'+(y+4)+'" font-size="12" text-anchor="end" fill="'+mute+'">'+(+v.toFixed(2))+'</text>';}
    s+='<line x1="'+m.l+'" x2="'+m.l+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" stroke="'+mute+'"/><line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+(m.t+ih)+'" y2="'+(m.t+ih)+'" stroke="'+mute+'"/>';
    xs.forEach(function(x,i){s+='<text x="'+sx(i)+'" y="'+(m.t+ih+20)+'" font-size="12" text-anchor="middle" fill="'+mute+'">'+esc(x)+'</text>'});

    sel.forEach(function(t){
      var c=colorOf[t],pts=cache[t].series.map(function(p){return{i:xs.indexOf(p.x),y:p.y,x:p.x}}).sort(function(a,b){return a.i-b.i});
      s+='<path d="'+pts.map(function(p,k){return(k?"L":"M")+sx(p.i).toFixed(1)+" "+sy(p.y).toFixed(1)}).join(" ")+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round"/>';
      pts.forEach(function(p){
        s+='<circle cx="'+sx(p.i)+'" cy="'+sy(p.y)+'" r="5" fill="'+panel+'" stroke="'+c+'" stroke-width="3"><title>'+esc(t)+' '+esc(p.x)+': '+p.y+'</title></circle>';
        if($("vals").checked)s+='<text x="'+sx(p.i)+'" y="'+(sy(p.y)-12)+'" font-size="11" font-weight="600" text-anchor="middle" fill="'+c+'">'+p.y+'</text>';
      });
    });
    s+='<text x="'+(m.l+iw/2)+'" y="'+(H-14)+'" font-size="13" text-anchor="middle" fill="'+ink+'">'+esc($("xl").value)+'</text>';
    s+='<text transform="translate(16 '+(m.t+ih/2)+') rotate(-90)" font-size="13" text-anchor="middle" fill="'+ink+'">'+esc($("yl").value)+'</text></svg>';
    host.innerHTML=s;
    var upd=sel.map(function(t){return cache[t].updated}).sort()[0];
    $("note").textContent="Data last updated: "+upd;
  }

  function ensure(t){
    if(cache[t])return Promise.resolve();
    return fetch("data/"+encodeURIComponent(t)+".json",{cache:"no-store"})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){cache[t]=d}).catch(function(){cache[t]={series:[]}});
  }
  function refresh(){Promise.all(selected().map(ensure)).then(draw)}

  fetch("data/index.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){
    if(!list.length)throw 0;
    tickers=list;
    list.forEach(function(t,i){colorOf[t]=COLORS[i%COLORS.length]});
    $("tickers").innerHTML=list.map(function(t,i){
      return'<label><input type="checkbox" value="'+esc(t)+'"'+(i===0?' checked':'')+'><i class="sw" style="background:'+colorOf[t]+'"></i>'+esc(t)+'</label>'}).join("");
    $("tickers").addEventListener("change",refresh);
    refresh();
  }).catch(function(){$("chart").innerHTML='<div class="msg">No data yet. Run the "Fetch Screener data" workflow first.</div>'});

  ["title","xl","yl"].forEach(function(i){$(i).addEventListener("input",draw)});
  ["zero","vals"].forEach(function(i){$(i).addEventListener("change",draw)});
})();
</script>
</body>
</html>
