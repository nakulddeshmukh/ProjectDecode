name: Fetch Screener data

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 03:30 UTC (09:00 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      tickers:
        description: "Space-separated Screener tickers"
        default: "SAMHI"

permissions:
  contents: write           # needed to commit the data files back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TICKERS: ${{ github.event.inputs.tickers || 'SAMHI' }}
        run: python fetch_screener.py $TICKERS

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update Screener data" && git push)
